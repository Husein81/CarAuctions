services:
  postgres:
    # Pinned: from postgres 18 the image keeps data under /var/lib/postgresql/<version>/,
    # so the pgdata mount below would silently stop persisting anything.
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=husein81
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3
  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=husein81
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "127.0.0.1/test",
          "--eval",
          "'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 5
  auction-svc:
    image: trycatchlearn/auction-svc:latest
    build:
      context: .
      dockerfile: services/AuctionService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
      - ConnectionStrings__DefaultConnection=Server=postgres:5432;User Id=postgres;Password=husein81;Database=auctions
      - IdentityServiceUrl=http://identity-svc
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:7777
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
    ports:
      - 5001:80
      - 7777:7777
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  search-svc:
    image: trycatchlearn/search-svc:latest
    build:
      context: .
      dockerfile: services/SearchService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
      # SearchService reads MongoDB:ConnectionString / MongoDB:DatabaseName. To use a hosted
      # cluster instead, set SEARCH_MONGO_CONNECTION in an untracked .env file.
      - MongoDB__ConnectionString=${SEARCH_MONGO_CONNECTION:-mongodb://root:husein81@mongodb}
      - MongoDB__DatabaseName=SearchDb
      - AuctionServiceUrl=http://auction-svc
    ports:
      - 5002:80
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  identity-svc:
    image: trycatchlearn/identity-svc:latest
    build:
      context: .
      dockerfile: services/IdentityService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Username=postgres;Password=husein81;Database=identity
    ports:
      - 5003:80
    depends_on:
      postgres:
        condition: service_healthy
  gateway-svc:
    image: trycatchlearn/gateway-svc:latest
    build:
      context: .
      dockerfile: services/GatewayService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - ClientApp=http://localhost:3000
      - IdentityServiceUrl=http://identity-svc
      - VIRTUAL_HOST=localhost
    ports:
      - "7001:80"
    depends_on:
      - auction-svc
      - search-svc
      - identity-svc
      - bid-svc
  bid-svc:
    image: trycatchlearn/bid-svc:latest
    build:
      context: .
      dockerfile: services/BiddingService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
      # Override with BID_MONGO_CONNECTION in an untracked .env file to use a hosted cluster.
      - ConnectionStrings__BidDbConnection=${BID_MONGO_CONNECTION:-mongodb://root:husein81@mongodb}
      - IdentityServiceUrl=http://identity-svc
      - GrpcAuction=http://auction-svc:7777
    ports:
      - 5004:80
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  notify-svc:
    image: trycatchlearn/notify-svc:latest
    build:
      context: .
      dockerfile: services/NotificationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
    ports:
      - 5005:80
    depends_on:
      - rabbitmq
  web-app:
    image: trycatchlearn/web-app:latest
    depends_on:
      - gateway-svc
    build:
      context: .
      dockerfile: frontend/web-app/Dockerfile
      # NEXT_PUBLIC_* are inlined at build time, so they are build args, not environment.
      # They are the addresses the browser uses (published host ports).
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:7001
        - NEXT_PUBLIC_ID_URL=http://localhost:5003
    volumes:
      - /var/lib/web/data
    ports:
      - 3000:3000
    environment:
      - AUTH_SECRET=7d2f9b1c-3ea4-4f2b-9a6b-9f0c2d5a8b6e
      - AUTH_URL_INTERNAL=http://web-app:3000
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./devcerts:/etc/nginx/certs
volumes:
  pgdata:
  mongodata:
