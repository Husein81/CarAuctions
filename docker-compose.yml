services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=husein81
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3
  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=husein81
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "127.0.0.1/test",
          "--eval",
          "'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
        test: rabbitmq-diagnostics check_port_connectivity
        interval: 5s
        timeout: 5s
        retries: 5
  auction-svc:
    image: trycatchlearn/auction-svc:latest
    build:
        context: .
        dockerfile: src/AuctionService/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:80
        - RabbitMq__Host=rabbitmq 
        - ConnectionStrings__DefaultConnection=Server=postgres:5432;User Id=postgres;Password=husein81;Database=auctions
        - IdentityServiceUrl=http://identity-svc
    ports:
        - 5001:80
    depends_on:
        postgres:
          condition: service_healthy
        rabbitmq:
            condition: service_healthy
  search-svc:
    image: trycatchlearn/search-svc:latest
    build:
        context: .
        dockerfile: src/SearchService/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:80
        - RabbitMq__Host=rabbitmq 
        - ConnectionStrings__DefaultConnection=mongodb+srv://husseinnasrallah2002:hu$$ein81@mern.ccxpdo3.mongodb.net/searchAuctionsDb?retryWrites=true&w=majority&appName=mern
        - IdentityServiceUrl=http://identity-svc
    ports:
        - 5002:80
    depends_on:
        mongodb:
          condition: service_healthy
        rabbitmq:
            condition: service_healthy
  identity-svc:
    image: trycatchlearn/identity-svc:latest
    build:
        context: .
        dockerfile: src/IdentityService/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=Docker
        - ASPNETCORE_URLS=http://+:80
        - ConnectionStrings__DefaultConnection=Server=postgres:5432;User Id=postgres;Password=husein81;Database=identity
    ports:
        - 5003:80
    depends_on:
        postgres:
          condition: service_healthy    
  gateway-svc:
      image: trycatchlearn/search-svc:latest
      build:
          context: .
          dockerfile: src/SearchService/Dockerfile
      environment:
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_URLS=http://+:80
          - RabbitMq__Host=rabbitmq 
          - ConnectionStrings__DefaultConnection=mongodb+srv://husseinnasrallah2002:hu$$ein81@mern.ccxpdo3.mongodb.net/searchAuctionsDb?retryWrites=true&w=majority&appName=mern
          - IdentityServiceUrl=http://identity-svc
      ports:
          - 6000:80
      depends_on:
            mongodb:
              condition: service_healthy
            rabbitmq:
               condition: service_healthy
  bid-svc:
      image: trycatchlearn/bid-svc:latest
      build:
          context: .
          dockerfile: src/BidService/Dockerfile
      environment:
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_URLS=http://+:80
          - RabbitMq__Host=rabbitmq 
          - ConnectionStrings__BidDbConnection=mongodb://root:husein81@localhost
          - IdentityServiceUrl=http://identity-svc
      ports:
          - 5004:80
      depends_on:
            mongodb:
              condition: service_healthy    
            rabbitmq:
               condition: service_healthy
volumes:
   pgdata:
   mongodata: