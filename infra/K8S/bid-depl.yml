apiVersion: apps/v1
kind: Deployment
metadata:
  name: bid-svc
spec:
  selector:
    matchLabels:
      app: bid-svc
  template:
    metadata:
      labels:
        app: bid-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: bid-svc
          image: trycatchlearn/bid-svc
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: bid-svc-config
          env:
            - name: ConnectionStrings__BidDbConnection
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BID_MONGO_CONNECTION
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bid-svc-config
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:80"
  RabbitMq__Host: "rabbitmq"
  IdentityServiceUrl: "http://identity-svc"
  GrpcAuction: "http://auction-svc:7777"
---
apiVersion: v1
kind: Service
metadata:
  name: bid-svc
spec:
  type: ClusterIP
  selector:
    app: bid-svc
  ports:
    - port: 80
      targetPort: 80
