apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-svc
spec:
  selector:
    matchLabels:
      app: search-svc
  template:
    metadata:
      labels:
        app: search-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: search-svc
          image: trycatchlearn/search-svc
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: search-svc-config
          env:
            - name: MongoDB__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SEARCH_MONGO_CONNECTION
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: search-svc-config
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:80"
  RabbitMq__Host: "rabbitmq"
  AuctionServiceUrl: "http://auction-svc"
  MongoDB__DatabaseName: "SearchDb"
---
apiVersion: v1
kind: Service
metadata:
  name: search-svc
spec:
  type: ClusterIP
  selector:
    app: search-svc
  ports:
    - port: 80
      targetPort: 80
