apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc
spec:
  selector:
    matchLabels:
      app: gateway-svc
  template:
    metadata:
      labels:
        app: gateway-svc
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway-svc
          image: trycatchlearn/gateway-svc
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: gateway-svc-config
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-svc-config
data:
  # "Docker" loads appsettings.Docker.json, whose routes point at http://auction-svc,
  # http://search-svc, http://bid-svc and http://notify-svc - the Service names in this folder.
  ASPNETCORE_ENVIRONMENT: "Docker"
  ASPNETCORE_URLS: "http://+:80"
  ClientApp: "http://localhost:3000"
  IdentityServiceUrl: "http://identity-svc"
---
# Browser-facing API address, http://localhost:7001 (same as docker-compose).
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
spec:
  type: LoadBalancer
  selector:
    app: gateway-svc
  ports:
    - port: 7001
      targetPort: 80
